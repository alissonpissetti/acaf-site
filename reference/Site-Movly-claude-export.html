  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 background: #8254E4\"><\u002Fspan>\n                    <span style=\"display: flex; flex-direction: column; flex: 1\"><span style=\"font-weight: 600; font-size: 13px\">Dança<\u002Fspan><span style=\"font-size: 11px; color: #6F6A86\">1,2 km<\u002Fspan><\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"margin: auto 16px 18px; padding: 14px; border-radius: 999px; background: #8254E4; color: #FFFFFF; text-align: center; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 13px\">fazer check-in<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Modalidades -->\n  <section aria-label=\"Modalidades\" style=\"max-width: 1200px; margin: 0 auto; padding: 48px 24px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px\">\n    <span style=\"font-weight: 700; color: #3D3756; margin-right: 8px\">Vale:<\u002Fspan>\n    <span style=\"padding: 10px 20px; border-radius: 999px; background: #F6F5FB; border: 1px solid #E9E6F2; font-weight: 600\">musculação<\u002Fspan>\n    <span style=\"padding: 10px 20px; border-radius: 999px; background: #F6F5FB; border: 1px solid #E9E6F2; font-weight: 600\">yoga<\u002Fspan>\n    <span style=\"padding: 10px 20px; border-radius: 999px; background: #F6F5FB; border: 1px solid #E9E6F2; font-weight: 600\">pilates<\u002Fspan>\n    <span style=\"padding: 10px 20px; border-radius: 999px; background: #F6F5FB; border: 1px solid #E9E6F2; font-weight: 600\">dança<\u002Fspan>\n    <span style=\"padding: 10px 20px; border-radius: 999px; background: #F6F5FB; border: 1px solid #E9E6F2; font-weight: 600\">luta<\u002Fspan>\n    <span style=\"padding: 10px 20px; border-radius: 999px; background: #F6F5FB; border: 1px solid #E9E6F2; font-weight: 600\">funcional<\u002Fspan>\n    <span style=\"padding: 10px 20px; border-radius: 999px; background: #CBF74F; font-weight: 700; color: #2A1B57\">e o seu jeito<\u002Fspan>\n  <\u002Fsection>\n\n  <!-- COMO FUNCIONA -->\n  <section id=\"como-funciona\" style=\"max-width: 1200px; margin: 0 auto; padding: 72px 24px\">\n    <div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 720px; margin-bottom: 48px\">\n      <span style=\"font-weight: 700; color: #8254E4; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase\">Como funciona<\u002Fspan>\n      <h2 style=\"margin: 0; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: clamp(32px, 4vw, 52px); line-height: 1.08; letter-spacing: -0.03em\">movly em 3 passos.<\u002Fh2>\n      <p style=\"margin: 0; font-size: 19px; color: #3D3756\">Sua empresa oferece, você escolhe onde e quando treinar. Sem burocracia, sem culpa, no seu ritmo.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px\">\n      <div style=\"position: relative; overflow: hidden; border-radius: 32px; background: #8254E4; padding: 36px; min-height: 300px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px\">\n        <span style=\"font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 600; font-size: 96px; line-height: 0.9; color: #CBF74F\">1<\u002Fspan>\n        <h3 style=\"margin: auto 0 0; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 24px; line-height: 1.15; color: #FFFFFF\">Sua empresa entra na Movly<\u002Fh3>\n        <p style=\"margin: 0; color: rgba(255, 255, 255, 0.9)\">O RH fecha o contrato, define quanto a empresa investe por colaborador e cadastra o time no portal.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position: relative; overflow: hidden; border-radius: 32px; background: linear-gradient(160deg, #89B4E0 0%, #7579E5 100%); padding: 36px; min-height: 300px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px\">\n        <span style=\"font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 600; font-size: 96px; line-height: 0.9; color: #FFFFFF\">2<\u002Fspan>\n        <h3 style=\"margin: auto 0 0; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 24px; line-height: 1.15; color: #1A1530\">Você ativa no app e escolhe seu plano<\u002Fh3>\n        <p style=\"margin: 0; color: #1A1530\">O convite chega pela sua empresa. Você escolhe o plano e completa a diferença, se houver.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position: relative; overflow: hidden; border-radius: 32px; background: #CBF74F; padding: 36px; min-height: 300px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px\">\n        <span style=\"font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 600; font-size: 96px; line-height: 0.9; color: #8254E4\">3<\u002Fspan>\n        <h3 style=\"margin: auto 0 0; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 24px; line-height: 1.15; color: #2A1B57\">Escolhe onde treinar e faz check-in<\u002Fh3>\n        <p style=\"margin: 0; color: #2A1B57\">Academia, estúdio ou aula da rede. Hoje musculação, amanhã yoga. Pode.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- EMPRESAS -->\n  <section id=\"empresas\" style=\"background: #F6F5FB; padding: 96px 24px\">\n    <div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 56px; align-items: center\">\n      <div style=\"flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n        <span style=\"font-weight: 700; color: #8254E4; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase\">Para empresas<\u002Fspan>\n        <h2 style=\"margin: 0; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: clamp(32px, 4vw, 52px); line-height: 1.08; letter-spacing: -0.03em\">benefício parado é dinheiro parado.<\u002Fh2>\n        <p style=\"margin: 0; font-size: 19px; color: #3D3756\">Muita empresa paga por benefício que ninguém usa. Na Movly, a empresa entra com uma parte, só por quem fez check-in no mês, e o colaborador completa com o plano que escolher.<\u002Fp>\n        <ul style=\"list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 16px\">\n          <li style=\"display: flex; gap: 14px; align-items: flex-start\">\n            <span style=\"width: 32px; height: 32px; flex: none; border-radius: 50%; background: #CBF74F; display: flex; align-items: center; justify-content: center\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2A1B57\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <span><strong>Só paga quem usa.<\u002Fstrong> Colaborador sem check-in no mês não entra na fatura.<\u002Fspan>\n          <\u002Fli>\n          <li style=\"display: flex; gap: 14px; align-items: flex-start\">\n            <span style=\"width: 32px; height: 32px; flex: none; border-radius: 50%; background: #CBF74F; display: flex; align-items: center; justify-content: center\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2A1B57\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <span><strong>Valor fixo, sem surpresa.<\u002Fstrong> Fez 1 ou 100 check-ins, o valor por colaborador é o mesmo.<\u002Fspan>\n          <\u002Fli>\n          <li style=\"display: flex; gap: 14px; align-items: flex-start\">\n            <span style=\"width: 32px; height: 32px; flex: none; border-radius: 50%; background: #CBF74F; display: flex; align-items: center; justify-content: center\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2A1B57\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <span><strong>Cadastro em minutos, gestão num portal só.<\u002Fstrong> Convites, colaboradores ativos e faturas no mesmo lugar.<\u002Fspan>\n          <\u002Fli>\n          <li style=\"display: flex; gap: 14px; align-items: flex-start\">\n            <span style=\"width: 32px; height: 32px; flex: none; border-radius: 50%; background: #CBF74F; display: flex; align-items: center; justify-content: center\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2A1B57\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <span><strong>Custo compartilhado.<\u002Fstrong> A empresa banca uma parte; o colaborador escolhe e completa o próprio plano.<\u002Fspan>\n          <\u002Fli>\n        <\u002Ful>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px; padding-top: 12px\">\n          <a href=\"#contato\" style=\"display: inline-flex; align-items: center; gap: 10px; min-height: 56px; box-sizing: border-box; padding: 16px 28px; border-radius: 999px; background: #8254E4; color: #FFFFFF; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 16px; text-decoration: none\">Solicitar proposta<\u002Fa>\n          <a href=\"#simulador\" style=\"display: inline-flex; align-items: center; min-height: 56px; box-sizing: border-box; padding: 16px 24px; border-radius: 999px; border: 2px solid #8254E4; color: #8254E4; font-weight: 700; font-size: 16px; text-decoration: none\">Simular custo<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Portal mockup -->\n      <div style=\"flex: 1 1 480px; min-width: 0\">\n        <div role=\"img\" aria-label=\"Portal da empresa Movly com lista de colaboradores e fatura do , 'Figtree', sans-serif; font-weight: 500; font-size: 18px\">colaboradores<\u002Fspan>\n            <div style=\"display: flex; flex-direction: column; gap: 12px\">\n              <div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"width: 34px; height: 34px; border-radius: 50%; background: #E9E6F2; flex: none\"><\u002Fspan><span style=\"height: 12px; flex: 1; max-width: 180px; border-radius: 999px; background: #E9E6F2\"><\u002Fspan><span style=\"margin-left: auto; padding: 6px 12px; border-radius: 999px; background: rgba(203, 247, 79, 0.7); color: #2A1B57; font-weight: 700; font-size: 13px\">ativo<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"width: 34px; height: 34px; border-radius: 50%; background: #E9E6F2; flex: none\"><\u002Fspan><span style=\"height: 12px; flex: 1; max-width: 150px; border-radius: 999px; background: #E9E6F2\"><\u002Fspan><span style=\"margin-left: auto; padding: 6px 12px; border-radius: 999px; background: rgba(203, 247, 79, 0.7); color: #2A1B57; font-weight: 700; font-size: 13px\">ativo<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"width: 34px; height: 34px; border-radius: 50%; background: #E9E6F2; flex: none\"><\u002Fspan><span style=\"height: 12px; flex: 1; max-width: 170px; border-radius: 999px; background: #E9E6F2\"><\u002Fspan><span style=\"margin-left: auto; padding: 6px 12px; border-radius: 999px; background: #F1EFF7; color: #5E5975; font-weight: 700; font-size: 13px\">sem check-in<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"width: 34px; height: 34px; border-radius: 50%; background: #E9E6F2; flex: none\"><\u002Fspan><span style=\"height: 12px; flex: 1; max-width: 140px; border-radius: 999px; background: #E9E6F2\"><\u002Fspan><span style=\"margin-left: auto; padding: 6px 12px; border-radius: 999px; background: #F1EFF7; color: #5E5975; font-weight: 700; font-size: 13px\">convidado<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 999px; background: #8254E4; color: #FFFFFF; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 13px\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#CBF74F\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>\n              convidar colaboradores\n            <\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SIMULADOR -->\n  <section id=\"simulador\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px\">\n    <div style=\"position: relative; overflow: hidden; border-radius: 40px; background: #2A1B57; color: #FFFFFF; padding: clamp(32px, 5vw, 64px); display: flex; flex-wrap: wrap; gap: 48px\">\n      <div aria-hidden=\"true\" style=\"position: absolute; right: -200px; bottom: -240px; width: 520px; height: 520px; border-radius: 50%; border: 80px solid rgba(117, 121, 229, 0.45); box-sizing: border-box\"><\u002Fdiv>\n      <div style=\"position: relative; flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 28px\">\n        <div style=\"display: flex; flex-direction: column; gap: 12px\">\n          <span style=\"font-weight: 700; color: #CBF74F; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase\">Simulador<\u002Fspan>\n          <h2 style=\"margin: 0; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: clamp(28px, 3.4vw, 44px); line-height: 1.1; letter-spacing: -0.03em\">quanto a sua empresa investiria?<\u002Fh2>\n          <p style=\"margin: 0; color: rgba(255, 255, 255, 0.85); font-size: 17px\">Mexa nos números e veja a parte da empresa quando ela paga só por quem usa, em vez de pagar por todos.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <label for=\"sim-total\" style=\"display: flex; justify-content: space-between; font-weight: 600\"><span>Colaboradores na empresa<\u002Fspan><span style=\"color: #CBF74F\">{{totalLabel}}<\u002Fspan><\u002Flabel>\n          <input id=\"sim-total\" type=\"range\" min=\"10\" max=\"2000\" step=\"10\" value=\"{{total}}\" sc-camel-on-change=\"{{onTotal}}\">\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <label for=\"sim-pct\" style=\"display: flex; justify-content: space-between; font-weight: 600\"><span>Quantos fazem check-in no mês<\u002Fspan><span style=\"color: #CBF74F\">{{pctLabel}}<\u002Fspan><\u002Flabel>\n          <input id=\"sim-pct\" type=\"range\" min=\"5\" max=\"100\" step=\"5\" value=\"{{pct}}\" sc-camel-on-change=\"{{onPct}}\">\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <label for=\"sim-valor\" style=\"display: flex; justify-content: space-between; font-weight: 600\"><span>Parte da empresa por colaborador ativo<\u002Fspan><span style=\"color: #CBF74F\">{{valorLabel}}<\u002Fspan><\u002Flabel>\n          <input id=\"sim-valor\" type=\"range\" min=\"30\" max=\"60\" step=\"1\" value=\"{{valor}}\" sc-camel-on-change=\"{{onValor}}\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position: relative; flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 16px; justify-content: center\">\n        <div style=\"border-radius: 28px; background: #CBF74F; color: #2A1B57; padding: 28px; display: flex; flex-direction: column; gap: 6px\">\n          <span style=\"font-weight: 700\">Investimento da empresa no mês<\u002Fspan>\n          <span style=\"font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: clamp(34px, 4vw, 48px); line-height: 1.05; letter-spacing: -0.02em\">{{fatura}}<\u002Fspan>\n          <span style=\"font-size: 15px\">{{ativosLabel}} × {{valorLabel}}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border-radius: 28px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); padding: 24px 28px; display: flex; flex-direction: column; gap: 4px\">\n          <span style=\"font-weight: 600; color: rgba(255, 255, 255, 0.85)\">Se pagasse por todos<\u002Fspan>\n          <span style=\"font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 28px; text-decoration: line-through; text-decoration-thickness: 2px; color: rgba(255, 255, 255, 0.8)\">{{tradicional}}<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size: 17px\"><strong style=\"color: #CBF74F\">{{economia}}<\u002Fstrong> que deixam de virar custo parado, todo mês.<\u002Fspan>\n        <span style=\"font-size: 14px; color: rgba(255, 255, 255, 0.75)\">Não inclui o plano que cada colaborador escolhe e paga por conta própria.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- COLABORADORES -->\n  <section id=\"colaboradores\" style=\"padding: 0 16px\">\n    <div style=\"position: relative; overflow: hidden; max-width: 1408px; margin: 0 auto; border-radius: 48px; background: #CBF74F; padding: clamp(48px, 7vw, 96px) clamp(24px, 5vw, 72px)\">\n      <div aria-hidden=\"true\" style=\"position: absolute; right: -160px; top: -160px; width: 480px; height: 480px; border-radius: 50%; border: 80px solid #8254E4; box-sizing: border-box\"><\u002Fdiv>\n      <div style=\"position: relative; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px\">\n        <div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 760px\">\n          <span style=\"font-weight: 700; color: #2A1B57; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase\">Para colaboradores<\u002Fspan>\n          <h2 style=\"margin: 0; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: clamp(32px, 4.4vw, 58px); line-height: 1.06; letter-spacing: -0.03em; color: #8254E4\">não precisa amar academia. só precisa achar o seu jeito.<\u002Fh2>\n          <p style=\"margin: 0; font-size: 19px; color: #2A1B57\">Tem gente que ama puxar ferro. Tem gente que prefere dançar, lutar ou alongar. Na Movly, o seu jeito de se mexer muda quando você quiser.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px\">\n          <div style=\"border-radius: 28px; background: #FFFFFF; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n            <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8254E4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><path d=\"M12 21s-7-5.6-7-11a7 7 0 0114 0c0 5.4-7 11-7 11z\"><\u002Fpath><\u002Fsvg>\n            <h3 style=\"margin: 0; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 19px\">Uma rede, vários lugares<\u002Fh3>\n            <p style=\"margin: 0; color: #3D3756\">Academias, estúdios e aulas perto de casa ou do trabalho.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-radius: 28px; background: #FFFFFF; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n            <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8254E4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 2l4 4-4 4\"><\u002Fpath><path d=\"M3 11V9a3 3 0 013-3h15\"><\u002Fpath><path d=\"M7 22l-4-4 4-4\"><\u002Fpath><path d=\"M21 13v2a3 3 0 01-3 3H3\"><\u002Fpath><\u002Fsvg>\n            <h3 style=\"margin: 0; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 19px\">Troca quando quiser<\u002Fh3>\n            <p style=\"margin: 0; color: #3D3756\">Musculação de manhã, yoga na quarta, dança na sexta.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-radius: 28px; background: #FFFFFF; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n            <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8254E4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"6\" y=\"2\" width=\"12\" height=\"20\" rx=\"3\"><\u002Frect><path d=\"M11 18h2\"><\u002Fpath><\u002Fsvg>\n            <h3 style=\"margin: 0; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 19px\">Check-in pelo app<\u002Fh3>\n            <p style=\"margin: 0; color: #3D3756\">Chegou, abriu o app, entrou. Sem papelada.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-radius: 28px; background: #FFFFFF; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n            <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8254E4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 12v9H4v-9\"><\u002Fpath><path d=\"M2 7h20v5H2z\"><\u002Fpath><path d=\"M12 22V7\"><\u002Fpath><path d=\"M12 7H8a2.5 2.5 0 010-5c3 0 4 5 4 5zM12 7h4a2.5 2.5 0 000-5c-3 0-4 5-4 5z\"><\u002Fpath><\u002Fsvg>\n            <h3 style=\"margin: 0; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 19px\">A empresa ajuda a pagar<\u002Fh3>\n            <p style=\"margin: 0; color: #3D3756\">Sua empresa entra com uma parte. Você escolhe o plano e completa o resto.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"planos\" style=\"display: flex; flex-direction: column; gap: 20px\">\n          <div style=\"display: flex; flex-direction: column; gap: 8px; max-width: 760px\">\n            <h3 style=\"margin: 0; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.1; color: #2A1B57\">escolha o seu plano.<\u002Fh3>\n            <p style=\"margin: 0; font-size: 17px; color: #2A1B57\">A parte da empresa já vem descontada. Você paga só a diferença do plano que escolher. [VALORES finais dependem do que cada empresa investe]<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px\">\n          <div style=\"border-radius: 28px; background: #FFFFFF; color: #1A1530; padding: 28px; display: flex; flex-direction: column; gap: 10px\">\n            <span style=\"font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 20px\">[PLANO 1]<\u002Fspan>\n            <span style=\"font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 34px; line-height: 1.05\">R$ [—]<span style=\"font-family: 'Figtree', sans-serif; font-size: 16px; font-weight: 600\">/mês<\u002Fspan><\u002Fspan>\n            <span style=\"font-size: 15px\">[REDE / MODALIDADES]<\u002Fspan>\n            <span style=\"font-size: 15px\">[O QUE O PLANO INCLUI]<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border-radius: 28px; background: #8254E4; color: #FFFFFF; padding: 28px; display: flex; flex-direction: column; gap: 10px\">\n            <span style=\"font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 20px\">[PLANO 2]<\u002Fspan>\n            <span style=\"font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 34px; line-height: 1.05\">R$ [—]<span style=\"font-family: 'Figtree', sans-serif; font-size: 16px; font-weight: 600\">/mês<\u002Fspan><\u002Fspan>\n            <span style=\"font-size: 15px\">[REDE / MODALIDADES]<\u002Fspan>\n            <span style=\"font-size: 15px\">[O QUE O PLANO INCLUI]<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border-radius: 28px; background: #2A1B57; color: #FFFFFF; padding: 28px; display: flex; flex-direction: column; gap: 10px\">\n            <span style=\"font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 20px\">[PLANO 3]<\u002Fspan>\n            <span style=\"font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 34px; line-height: 1.05\">R$ [—]<span style=\"font-family: 'Figtree', sans-serif; font-size: 16px; font-weight: 600\">/mês<\u002Fspan><\u002Fspan>\n            <span style=\"font-size: 15px\">[REDE / MODALIDADES]<\u002Fspan>\n            <span style=\"font-size: 15px\">[O QUE O PLANO INCLUI]<\u002Fspan>\n          <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 16px\">\n          <a href=\"#contato\" style=\"display: inline-flex; align-items: center; gap: 10px; min-height: 56px; box-sizing: border-box; padding: 16px 28px; border-radius: 999px; background: #8254E4; color: #FFFFFF; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 16px; text-decoration: none\">Indicar a Movly para o meu RH<\u002Fa>\n          <span style=\"color: #2A1B57; font-weight: 600\">Sua empresa ainda não tem? Manda pra quem decide.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ACADEMIAS -->\n  <section id=\"academias\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px\">\n    <div style=\"display: flex; flex-wrap: wrap; gap: 56px; align-items: center\">\n      <div style=\"flex: 1 1 420px; min-width: 0; position: relative; height: 460px; border-radius: 220px; background: linear-gradient(160deg, #89B4E0 0%, #7579E5 100%); overflow: hidden; display: flex; align-items: center; justify-content: center\">\n        <div aria-hidden=\"true\" style=\"position: absolute; left: -90px; bottom: -90px; width: 260px; height: 260px; border-radius: 50%; border: 50px solid #CBF74F; box-sizing: border-box\"><\u002Fdiv>\n        <div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 24px\">\n          <span style=\"font-size: 16px; font-weight: 700; color: #1A1530\">repasse médio<\u002Fspan>\n          <span style=\"font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 600; font-size: clamp(72px, 9vw, 128px); line-height: 0.95; letter-spacing: -0.04em; color: #FFFFFF\">~80%<\u002Fspan>\n          <span style=\"font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: clamp(20px, 2.2vw, 26px); color: #1A1530\">do valor fica com a sua academia<\u002Fspan>\n          <img src=\"09c0c23a-d1d4-4c0e-a637-fdf461acfe5a\" alt=\"by ACAF Brasil\" style=\"width: 130px; height: 40px; display: block; margin-top: 12px\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n        <span style=\"font-weight: 700; color: #8254E4; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase\">Para academias e estúdios<\u002Fspan>\n        <h2 style=\"margin: 0; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: clamp(32px, 4vw, 52px); line-height: 1.08; letter-spacing: -0.03em\">sem academia, não existe movly.<\u002Fh2>\n        <p style=\"margin: 0; font-size: 19px; color: #3D3756\">É na academia que o movimento acontece. Por isso a Movly foi desenhada a partir dela: quem recebe o aluno todo dia é o centro do modelo, não um fornecedor no fim da fila.<\u002Fp>\n        <p style=\"margin: 0; font-size: 19px; color: #3D3756\">Na prática, o dinheiro fica onde o treino acontece: em média, <strong style=\"color: #1A1530\">~80% do que é pago<\u002Fstrong> (parte da empresa + plano do aluno) é repassado à academia.<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px\">\n          <div style=\"border-radius: 24px; border: 1px solid #E9E6F2; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><strong style=\"font-size: 17px\">Mais alunos, sem papelada<\u002Fstrong><span style=\"color: #3D3756\">Colaboradores das empresas parceiras escolhem você no app e fazem check-in na hora.<\u002Fspan><\u002Fdiv>\n          <div style=\"border-radius: 24px; border: 1px solid #E9E6F2; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><strong style=\"font-size: 17px\">~80% de repasse médio<\u002Fstrong><span style=\"color: #3D3756\">A maior parte do valor volta para quem recebe o aluno, pelos check-ins feitos na sua unidade.<\u002Fspan><\u002Fdiv>\n          <div style=\"border-radius: 24px; border: 1px solid #E9E6F2; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><strong style=\"font-size: 17px\">Repasse transparente<\u002Fstrong><span style=\"color: #3D3756\">Check-ins e repasses visíveis para a academia, sem caixa-preta.<\u002Fspan><\u002Fdiv>\n          <div style=\"border-radius: 24px; border: 1px solid #E9E6F2; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><strong style=\"font-size: 17px\">ACAF Brasil ao seu lado<\u002Fstrong><span style=\"color: #3D3756\">A ACAF Brasil garante os direitos dos donos de academia, para que o modelo seja saudável para todos.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px; padding-top: 8px\">\n          <a href=\"#contato\" style=\"display: inline-flex; align-items: center; min-height: 56px; box-sizing: border-box; padding: 16px 28px; border-radius: 999px; background: #8254E4; color: #FFFFFF; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 16px; text-decoration: none\">Quero credenciar minha academia<\u002Fa>\n          <a href=\"#contato\" style=\"display: inline-flex; align-items: center; min-height: 56px; box-sizing: border-box; padding: 16px 24px; border-radius: 999px; border: 2px solid #8254E4; color: #8254E4; font-weight: 700; font-size: 16px; text-decoration: none\">Indicar minha academia<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- POR QUE MOVLY -->\n  <section id=\"modelo\" style=\"background: #8254E4; padding: 96px 24px; position: relative; overflow: hidden\">\n    <div aria-hidden=\"true\" style=\"position: absolute; left: -220px; top: -220px; width: 560px; height: 560px; border-radius: 50%; border: 90px solid rgba(137, 180, 224, 0.4); box-sizing: border-box\"><\u002Fdiv>\n    <div style=\"position: relative; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n      <h2 style=\"margin: 0; max-width: 820px; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: clamp(32px, 4vw, 52px); line-height: 1.08; letter-spacing: -0.03em; color: #CBF74F\">por que a movly é diferente.<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px\">\n        <div style=\"border-radius: 32px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.25); padding: 32px; display: flex; flex-direction: column; gap: 12px\">\n          <span style=\"font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 15px; color: #CBF74F\">sempre por uso<\u002Fspan>\n          <h3 style=\"margin: 0; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 22px; line-height: 1.2; color: #FFFFFF\">Cobrança só de quem fez check-in<\u002Fh3>\n          <p style=\"margin: 0; color: rgba(255, 255, 255, 0.9)\">Nada de pagar por licença esquecida. Não usou no mês, não paga.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-radius: 32px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.25); padding: 32px; display: flex; flex-direction: column; gap: 12px\">\n          <span style=\"font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 15px; color: #CBF74F\">sempre compartilhado<\u002Fspan>\n          <h3 style=\"margin: 0; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 22px; line-height: 1.2; color: #FFFFFF\">Empresa + colaborador<\u002Fh3>\n          <p style=\"margin: 0; color: rgba(255, 255, 255, 0.9)\">O RH entra com um valor fixo por quem usa; o colaborador escolhe o plano e completa a diferença.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-radius: 32px; background: #CBF74F; padding: 32px; display: flex; flex-direction: column; gap: 12px\">\n          <span style=\"font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 15px; color: #2A1B57\">repasse justo<\u002Fspan>\n          <h3 style=\"margin: 0; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 22px; line-height: 1.2; color: #2A1B57\">~80% fica com a academia<\u002Fh3>\n          <p style=\"margin: 0; color: #2A1B57\">Em média, a maior parte do valor vai para quem recebe o aluno. Academia valorizada é rede forte.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-radius: 32px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.25); padding: 32px; display: flex; flex-direction: column; gap: 12px\">\n          <span style=\"font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 15px; color: #CBF74F\">academia no centro<\u002Fspan>\n          <h3 style=\"margin: 0; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 22px; line-height: 1.2; color: #FFFFFF\">Sem academia, não existe agregador<\u002Fh3>\n          <p style=\"margin: 0; color: rgba(255, 255, 255, 0.9)\">A academia é o pivô de tudo. Por isso a ACAF Brasil garante os direitos dos donos de academia, para que o modelo seja saudável para todos.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- DÚVIDAS -->\n  <section id=\"duvidas\" style=\"max-width: 960px; margin: 0 auto; padding: 96px 24px\">\n    <div style=\"display: flex; flex-direction: column; gap: 14px; margin-bottom: 32px\">\n      <span style=\"font-weight: 700; color: #8254E4; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase\">Dúvidas<\u002Fspan>\n      <h2 style=\"margin: 0; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: clamp(32px, 4vw, 52px); line-height: 1.08; letter-spacing: -0.03em\">perguntas que todo mundo faz.<\u002Fh2>\n    <\u002Fdiv>\n    <div role=\"group\" aria-label=\"Escolha o público\" style=\"display: inline-flex; flex-wrap: wrap; gap: 6px; padding: 6px; border-radius: 999px; background: #F6F5FB; border: 1px solid #E9E6F2; margin-bottom: 24px\">\n      <button type=\"button\" aria-pressed=\"{{tabEmp.pressed}}\" sc-camel-on-click=\"{{tabEmp.pick}}\" style=\"{{tabEmp.style}}\">Empresas<\u002Fbutton>\n      <button type=\"button\" aria-pressed=\"{{tabCol.pressed}}\" sc-camel-on-click=\"{{tabCol.pick}}\" style=\"{{tabCol.style}}\">Colaboradores<\u002Fbutton>\n      <button type=\"button\" aria-pressed=\"{{tabAca.pressed}}\" sc-camel-on-click=\"{{tabAca.pick}}\" style=\"{{tabAca.style}}\">Academias<\u002Fbutton>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{isEmp}}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px\">\n        <details style=\"border-radius: 24px; border: 1px solid #E9E6F2; padding: 0 24px\">\n          <summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 18px\">Como a cobrança funciona?<svg class=\"faq-plus\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8254E4\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n          <p style=\"margin: 0 0 22px; color: #3D3756\">A empresa paga um valor fixo por colaborador que fez pelo menos um check-in no mês; quem não usou não entra na fatura. O colaborador completa com o plano que escolher. A fatura da empresa é mensal e recorrente, com histórico no portal.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-radius: 24px; border: 1px solid #E9E6F2; padding: 0 24px\">\n          <summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 18px\">O valor muda se a pessoa treinar muito?<svg class=\"faq-plus\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8254E4\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n          <p style=\"margin: 0 0 22px; color: #3D3756\">Não. Um check-in ou cem, a parte da empresa por colaborador ativo no mês é a mesma.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-radius: 24px; border: 1px solid #E9E6F2; padding: 0 24px\">\n          <summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 18px\">Como cadastro meus colaboradores?<svg class=\"faq-plus\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8254E4\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n          <p style=\"margin: 0 0 22px; color: #3D3756\">Pelo portal da empresa: você cadastra o time e envia os convites. Cada pessoa ativa o acesso no app.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-radius: 24px; border: 1px solid #E9E6F2; padding: 0 24px\">\n          <summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 18px\">Existe um número mínimo de colaboradores?<svg class=\"faq-plus\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8254E4\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n          <p style=\"margin: 0 0 22px; color: #3D3756\">[DEFINIR: tamanho mínimo de empresa]<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-radius: 24px; border: 1px solid #E9E6F2; padding: 0 24px\">\n          <summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 18px\">Consigo ver as faturas anteriores?<svg class=\"faq-plus\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8254E4\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n          <p style=\"margin: 0 0 22px; color: #3D3756\">Sim. O histórico de faturas fica no portal para consulta a qualquer momento.<\u002Fp>\n        <\u002Fdetails>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{isCol}}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px\">\n        <details style=\"border-radius: 24px; border: 1px solid #E9E6F2; padding: 0 24px\">\n          <summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 18px\">Quem pode usar?<svg class=\"faq-plus\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8254E4\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n          <p style=\"margin: 0 0 22px; color: #3D3756\">Colaboradores das empresas parceiras da Movly.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-radius: 24px; border: 1px solid #E9E6F2; padding: 0 24px\">\n          <summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 18px\">Quanto eu pago?<svg class=\"faq-plus\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8254E4\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n          <p style=\"margin: 0 0 22px; color: #3D3756\">Depende do plano que você escolher. Sua empresa já paga uma parte, e você completa a diferença. [COMO o colaborador paga: desconto em folha, cartão etc.]<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-radius: 24px; border: 1px solid #E9E6F2; padding: 0 24px\">\n          <summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 18px\">Como eu ativo?<svg class=\"faq-plus\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8254E4\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n          <p style=\"margin: 0 0 22px; color: #3D3756\">Pelo convite que chega da sua empresa. Baixe o app, aceite o convite e pronto.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-radius: 24px; border: 1px solid #E9E6F2; padding: 0 24px\">\n          <summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 18px\">Posso trocar de academia?<svg class=\"faq-plus\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8254E4\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n          <p style=\"margin: 0 0 22px; color: #3D3756\">Pode. A Movly é uma rede: você escolhe onde treinar.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-radius: 24px; border: 1px solid #E9E6F2; padding: 0 24px\">\n          <summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 18px\">Tem aula além de musculação?<svg class=\"faq-plus\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8254E4\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n          <p style=\"margin: 0 0 22px; color: #3D3756\">Tem: [LISTAR as modalidades que a rede já oferece].<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-radius: 24px; border: 1px solid #E9E6F2; padding: 0 24px\">\n          <summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 18px\">Minha empresa não tem. E agora?<svg class=\"faq-plus\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8254E4\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n          <p style=\"margin: 0 0 22px; color: #3D3756\">Mostra esta página pro RH. Ou deixa o contato dele no formulário abaixo que a gente conversa.<\u002Fp>\n        <\u002Fdetails>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{isAca}}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px\">\n        <details style=\"border-radius: 24px; border: 1px solid #E9E6F2; padding: 0 24px\">\n          <summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 18px\">Como minha academia entra na rede?<svg class=\"faq-plus\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8254E4\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n          <p style=\"margin: 0 0 22px; color: #3D3756\">O credenciamento é feito pela ACAF Brasil, que garante os direitos dos donos de academia dentro da Movly. Comece pelo formulário abaixo.<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-radius: 24px; border: 1px solid #E9E6F2; padding: 0 24px\">\n          <summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 18px\">Como recebo pelos alunos Movly?<svg class=\"faq-plus\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8254E4\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n          <p style=\"margin: 0 0 22px; color: #3D3756\">Em média, ~80% do valor pago (parte da empresa + plano do aluno) é repassado às academias, de acordo com os check-ins feitos na sua unidade. [DETALHAR periodicidade do repasse]<\u002Fp>\n        <\u002Fdetails>\n        <details style=\"border-radius: 24px; border: 1px solid #E9E6F2; padding: 0 24px\">\n          <summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; font-weight: 700; font-size: 18px\">Preciso mudar meu controle de acesso?<svg class=\"faq-plus\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8254E4\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n          <p style=\"margin: 0 0 22px; color: #3D3756\">Não. O check-in é pelo app. Integrar a catraca por QR code ou biometria é opcional.<\u002Fp>\n        <\u002Fdetails>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <!-- CONTATO -->\n  <section id=\"contato\" style=\"padding: 0 16px 96px\">\n    <div style=\"position: relative; overflow: hidden; max-width: 1408px; margin: 0 auto; border-radius: 48px; background: linear-gradient(135deg, #89B4E0 0%, #7579E5 100%); padding: clamp(40px, 6vw, 88px) clamp(24px, 5vw, 72px)\">\n      <div aria-hidden=\"true\" style=\"position: absolute; right: -120px; bottom: -160px; width: 420px; height: 420px; border-radius: 50%; border: 70px solid #CBF74F; box-sizing: border-box\"><\u002Fdiv>\n      <div style=\"position: relative; max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px; align-items: center\">\n        <div style=\"flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 18px\">\n          <h2 style=\"margin: 0; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: clamp(34px, 4.4vw, 60px); line-height: 1.04; letter-spacing: -0.035em; color: #1A1530\">bora conversar?<\u002Fh2>\n          <p style=\"margin: 0; font-size: 19px; color: #1A1530; max-width: 460px\">Conta um pouco sobre você e a gente volta com o próximo passo. Vale para empresas, colaboradores e academias.<\u002Fp>\n        <\u002Fdiv>\n        <form aria-label=\"Fale com a Movly\" style=\"flex: 1 1 440px; min-width: 0; background: #FFFFFF; border-radius: 32px; padding: 32px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 30px 70px rgba(42, 27, 87, 0.22)\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <label for=\"f-perfil\" style=\"font-weight: 600; font-size: 15px\">Eu sou<\u002Flabel>\n            <sc-raw-select id=\"f-perfil\" style=\"min-height: 52px; border-radius: 16px; border: 1px solid #D4CFE4; padding: 0 16px; font: inherit; font-size: 16px; color: #1A1530; background: #FFFFFF\">\n              <option>RH ou gestor de uma empresa<\u002Foption>\n              <option>Colaborador indicando minha empresa<\u002Foption>\n              <option>Dono(a) de academia ou estúdio<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 16px\">\n            <div style=\"flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px\">\n              <label for=\"f-nome\" style=\"font-weight: 600; font-size: 15px\">Nome<\u002Flabel>\n              <input id=\"f-nome\" type=\"text\" autocomplete=\"name\" style=\"min-height: 52px; box-sizing: border-box; border-radius: 16px; border: 1px solid #D4CFE4; padding: 0 16px; font: inherit; font-size: 16px\">\n            <\u002Fdiv>\n            <div style=\"flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px\">\n              <label for=\"f-email\" style=\"font-weight: 600; font-size: 15px\">E-mail<\u002Flabel>\n              <input id=\"f-email\" type=\"email\" autocomplete=\"email\" style=\"min-height: 52px; box-sizing: border-box; border-radius: 16px; border: 1px solid #D4CFE4; padding: 0 16px; font: inherit; font-size: 16px\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 16px\">\n            <div style=\"flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px\">\n              <label for=\"f-empresa\" style=\"font-weight: 600; font-size: 15px\">Empresa ou academia<\u002Flabel>\n              <input id=\"f-empresa\" type=\"text\" autocomplete=\"organization\" style=\"min-height: 52px; box-sizing: border-box; border-radius: 16px; border: 1px solid #D4CFE4; padding: 0 16px; font: inherit; font-size: 16px\">\n            <\u002Fdiv>\n            <div style=\"flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px\">\n              <label for=\"f-tel\" style=\"font-weight: 600; font-size: 15px\">WhatsApp<\u002Flabel>\n              <input id=\"f-tel\" type=\"tel\" autocomplete=\"tel\" style=\"min-height: 52px; box-sizing: border-box; border-radius: 16px; border: 1px solid #D4CFE4; padding: 0 16px; font: inherit; font-size: 16px\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <button type=\"button\" style=\"margin-top: 6px; min-height: 56px; border: 0; border-radius: 999px; background: #8254E4; color: #FFFFFF; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 16px; cursor: pointer\">Quero conversar<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- RODAPÉ -->\n  <footer style=\"background: #2A1B57; color: #FFFFFF; padding: 72px 24px 40px\">\n    <div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 48px; justify-content: space-between\">\n        <div style=\"flex: 1 1 300px; display: flex; flex-direction: column; gap: 16px\">\n          <div style=\"display: flex; flex-direction: column; align-items: flex-start; gap: 6px\">\n            <img src=\"06b9b558-2e00-445b-9e80-a6c88be1706f\" alt=\"movly.\" style=\"width: 170px; height: 50px; display: block\">\n            <img src=\"09c0c23a-d1d4-4c0e-a637-fdf461acfe5a\" alt=\"by ACAF Brasil\" style=\"width: 88px; height: 27px; display: block; margin-left: 82px\">\n          <\u002Fdiv>\n          <p style=\"margin: 0; font-family: 'Unbounded', 'Figtree', sans-serif; font-weight: 500; font-size: 18px; color: #CBF74F\">o bem-estar começa no movimento.<\u002Fp>\n        <\u002Fdiv>\n        <nav aria-label=\"Rodapé\" style=\"flex: 2 1 520px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 32px\">\n          <div style=\"display: flex; flex-direction: column; gap: 10px\">\n            <strong style=\"color: #CBF74F\">Movly<\u002Fstrong>\n            <a href=\"#como-funciona\" style=\"color: #FFFFFF; text-decoration: none\">Como funciona<\u002Fa>\n            <a href=\"#duvidas\" style=\"color: #FFFFFF; text-decoration: none\">Dúvidas<\u002Fa>\n            <a href=\"#contato\" style=\"color: #FFFFFF; text-decoration: none\">C :1440,&quot;height&quot;:9000}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { total: 200, pct: 40, valor: 45, tab: 'emp' };\n  }\n  brl(n) {\n    return 'R$ ' + Math.round(n).toLocaleString('pt-BR');\n  }\n  tab(id, current) {\n    var on = id === current;\n    return {\n      pressed: on ? 'true' : 'false',\n      pick: () => this.setState({ tab: id }),\n      style: {\n        minHeight: '44px', padding: '10px 22px', borderRadius: '999px', border: '0',\n        font: 'inherit', fontWeight: 700, fontSize: '15px', cursor: 'pointer',\n        background: on ? '#8254E4' : 'transparent', color: on ? '#FFFFFF' : '#3D3756'\n      }\n    };\n  }\n  renderVals() {\n    var s = this.state;\n    var ativos = Math.max(0, Math.round(s.total * s.pct / 100));\n    var fatura = ativos * s.valor;\n    var trad = s.total * s.valor;\n    return {\n      total: s.total,\n      pct: s.pct,\n      valor: s.valor,\n      totalLabel: s.total.toLocaleString('pt-BR'),\n      pctLabel: s.pct + '%',\n      valorLabel: this.brl(s.valor),\n      ativosLabel: ativos.toLocaleString('pt-BR') + ' ativos',\n      fatura: this.brl(fatura),\n      tradicional: this.brl(trad),\n      economia: this.brl(trad - fatura),\n      onTotal: (e) => this.setState({ total: Number(e.target.value) }),\n      onPct: (e) => this.setState({ pct: Number(e.target.value) }),\n      onValor: (e) => this.setState({ valor: Number(e.target.value) }),\n      tabEmp: this.tab('emp', s.tab),\n      tabCol: this.tab('col', s.tab),\n      tabAca: this.tab('aca', s.tab),\n      isEmp: s.tab === 'emp',\n      isCol: s.tab === 'col',\n      isAca: s.tab === 'aca'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
